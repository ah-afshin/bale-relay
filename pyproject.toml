[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "bale-relay"
version = "0.1.0"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = ["Flask>=3.0,<4", "requests>=2.31,<3", "SQLAlchemy>=2.0,<3", "alembic>=1.13,<2", "python-dotenv>=1,<2", "psycopg[binary]>=3.2,<4"]
[project.optional-dependencies]
media = ["yt-dlp[default]==2026.10.26"]
server = ["gunicorn==26.2.0; sys_platform != 'win32'"]
[project.scripts]
bale-relay = "bale_relay.entrypoints.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
